name: Unpack uploaded skill zip
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unpack-skill-zip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repository root
        run: |
          unzip -o ticket-cube-language-school.zip -d .
          git rm -q ticket-cube-language-school.zip
          git rm -q .github/workflows/unpack-skill-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ticket-cube-language-school skill (unpacked from upload)"
          git push
